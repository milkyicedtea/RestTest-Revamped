services:
  display:
    build:
      context: .
    image: resttest-display
    container_name: resttest-display
    env_file:
      - .env
    ports:
      - "4000:4000"
    networks:
      - display_net
      - caddy_net
    depends_on:
      - postgres

  postgres:
    image: postgres:18-bookworm
    container_name: resttest-display-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - display_net
    volumes:
      - display_pgdata:/var/lib/postgresql # this has to point to /var/lib/postgresql for pg18 to work
      - ./dbinit:/docker-entrypoint-initdb.d

volumes:
  display_pgdata:

networks:
  caddy_net:
    external: true
  display_net:
    driver: bridge
