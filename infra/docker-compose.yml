services:
  postgres:
    image: postgres:18-bookworm
    profiles: ["db"]
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - apinet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    profiles: ["db"]
    ports:
      - "${DRAGONFLY_HOST_PORT:-6380}:6379"
    networks:
      - apinet
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      retries: 10

  # Add APIs starting from here! Try to keep them alphabetically sorted, please :)
  hono:
    build: ../languages/typescript/hono
    profiles: ["api-hono"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/benchmark}
      PORT: ${HONO_PORT:-4101}
    ports:
      - "${HONO_HOST_PORT:-4101}:${HONO_PORT:-4101}"
    networks:
      - apinet
    # healthcheck:
    #   # test: ["CMD", "curl", "-f", "http://localhost:4101/health"]
    #   interval: 1s
    #   retries: 20

networks:
  apinet:
    driver: bridge
